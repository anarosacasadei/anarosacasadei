<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ana Rosa Casadei — portafolio</title>
<meta name="description" content="Ana Rosa Casadei, diseñadora brasileña: identidad visual, sitios web e interfaces.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bordo:#5C1A2B; --vinho:#7B0614; --rosa:#B76E79; --off:#F5F0E7; --tinta:#2c1d20;
    --ease:cubic-bezier(.65,0,.25,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /* mesa: tom liso de papel envelhecido, bem clarinho (sem textura) */
  html,body{height:100%;overflow:hidden;background:#f0e9d9}
  #bg{display:none}
  body{font-family:'Satoshi',system-ui,sans-serif;color:var(--tinta);-webkit-font-smoothing:antialiased}
  #viewport{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;left:50%;top:50%;width:1440px;height:1024px;transform-origin:0 0;perspective:2400px}
  #bg{position:absolute;inset:0;background:url(assets/papel.webp) 0 0/101.6% 100% no-repeat;-webkit-mask:linear-gradient(90deg,#000 96%,transparent);mask:linear-gradient(90deg,#000 96%,transparent)}
  .el{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;user-select:none;-webkit-user-drag:none}
  .desk{transition:transform 1.6s var(--ease), opacity .8s ease}
  .fx.desk{transition:opacity .8s ease}   /* chama, fumaça e notas acompanham o objeto: não deslizam sozinhas */
  img.el{display:block}

  /* ---------- vela y café ---------- */
  .fx{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none!important}
  .fx i{position:absolute;display:block;pointer-events:none}
  .fx .glow{left:0;top:0;width:520px;height:520px;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(255,196,110,.55) 0%, rgba(255,150,60,.28) 22%, rgba(255,120,40,.10) 45%, rgba(255,120,40,0) 68%);mix-blend-mode:screen}
  .fx .halo{left:-55px;top:-55px;width:110px;height:110px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,250,225,.95) 0%, rgba(255,214,140,.55) 30%, rgba(255,170,80,0) 70%);mix-blend-mode:screen}
  .fx .flame{left:-11px;top:-19px;width:22px;height:34px;border-radius:50% 50% 50% 50% / 62% 62% 40% 40%;transform-origin:50% 75%;
    background:radial-gradient(ellipse at 50% 68%, #fff 0%, #fff8e0 28%, #ffd27a 52%, rgba(255,140,40,.55) 72%, rgba(255,110,30,0) 100%);filter:blur(.6px)}
  .fx .steam{left:-45px;top:-120px;width:90px;height:150px;border-radius:50%;opacity:0;
    background:radial-gradient(ellipse at 50% 60%, rgba(255,255,255,.9), rgba(255,255,255,.35) 45%, rgba(255,255,255,0) 72%);
    filter:blur(9px);mix-blend-mode:screen;animation:steam 6.5s cubic-bezier(.35,.1,.45,1) infinite}
  .fx .s2{animation-delay:1.3s;animation-name:steam2}
  .fx .s3{animation-delay:2.6s}
  .fx .s4{animation-delay:3.9s;animation-name:steam2}
  .fx .s5{animation-delay:5.2s;animation-name:steam3}
  @keyframes steam{
    0%{opacity:0;transform:translate(0,60px) scale(.45,.5) rotate(0)}
    18%{opacity:.85}
    55%{opacity:.45;transform:translate(26px,-90px) scale(.9,1.15) rotate(10deg)}
    100%{opacity:0;transform:translate(-18px,-320px) scale(1.7,2) rotate(-8deg)}}
  @keyframes steam2{
    0%{opacity:0;transform:translate(-10px,60px) scale(.4,.5) rotate(0)}
    20%{opacity:.7}
    60%{opacity:.4;transform:translate(-34px,-80px) scale(.95,1.2) rotate(-12deg)}
    100%{opacity:0;transform:translate(14px,-240px) scale(1.6,1.9) rotate(6deg)}}
  @keyframes steam3{
    0%{opacity:0;transform:translate(8px,50px) scale(.35,.45)}
    25%{opacity:.6}
    100%{opacity:0;transform:translate(40px,-220px) scale(1.4,1.7) rotate(14deg)}}
  .fx .dim{left:-188px;top:-188px;width:380px;height:380px;border-radius:50%;opacity:0;mix-blend-mode:multiply;
    background:radial-gradient(circle, rgba(120,55,25,.6) 0%, rgba(110,50,25,.5) 50%, rgba(110,50,25,.3) 88%, rgba(110,50,25,0) 100%)}
  .fx .patch{left:-28px;top:-27px;width:56px;height:58px;border-radius:50%;opacity:0;
    background:radial-gradient(circle, rgb(236,125,47) 0%, rgb(236,125,47) 55%, rgba(236,125,47,0) 100%)}
  .fx .wick{left:-3px;top:-4px;width:6px;height:12px;border-radius:3px;opacity:0;rotate:8deg;
    background:linear-gradient(#2a1a14,#1a0f0b 70%,#ff7a2a);box-shadow:0 5px 4px -2px rgba(255,110,40,.7)}
  .fx .puddle{position:absolute;left:-200px;top:-232px;overflow:visible;transition:opacity 1.2s ease}
  .fx .puddle .gloss,.fx .puddle .spec{transition:opacity 2s ease}
  .fx .puddle.dry .gloss,.fx .puddle.dry .spec{opacity:0}
  .fx .puddle.dry{opacity:0;transition:opacity 6s ease 1s}
  .fx .sw{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .fx .smoke{left:-14px;top:-30px;width:28px;height:60px;border-radius:50%;opacity:0;
    background:radial-gradient(ellipse at 50% 70%, rgba(120,110,105,.75), rgba(120,110,105,0) 70%);filter:blur(5px)}
  .fx .smoke.puff{animation:puff 2.2s ease-out forwards}
  @keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.6)}40%{opacity:.6;transform:translate(10px,-70px) scale(1.2,1.6) rotate(12deg)}
    100%{opacity:0;transform:translate(-14px,-180px) scale(2,2.6) rotate(-10deg)}}
  /* iPod */
  .fx .screen{position:absolute;left:0;top:0;width:138px;height:110px;border-radius:3px;padding:9px 9px 0;opacity:0;transition:opacity .6s ease;
    background:linear-gradient(160deg,#cfe0e6,#9fb9c4 55%,#7f9ca8);box-shadow:inset 0 0 14px rgba(0,0,0,.35);font-family:'Satoshi',system-ui,sans-serif;color:#1d2b33;overflow:hidden}
  .playing .fx .screen{opacity:.92}
  .fx .screen b{display:block;font:600 9px 'Satoshi',system-ui;letter-spacing:.02em;border-bottom:1px solid rgba(29,43,51,.3);padding-bottom:4px}
  .fx .screen .mq{overflow:hidden;white-space:nowrap;margin-top:9px;font:500 11px 'Satoshi',system-ui}
  .fx .screen .mq span{display:inline-block;padding-left:100%;animation:mq 9s linear infinite}
  @keyframes mq{to{transform:translateX(-100%)}}
  .fx .screen .bar{position:absolute;left:9px;right:9px;bottom:12px;height:5px;border:1px solid rgba(29,43,51,.5);border-radius:4px;overflow:hidden}
  .fx .screen .bar i{position:absolute;left:0;top:0;bottom:0;width:30%;background:rgba(29,43,51,.6);animation:bar 30s linear infinite}
  @keyframes bar{from{width:0}to{width:100%}}
  .fx .note{position:absolute;left:0;top:0;font-family:'Fraunces',Georgia,serif;font-style:normal;color:var(--vinho);opacity:0;
    text-shadow:0 1px 0 rgba(255,255,255,.6);animation:note 3.2s cubic-bezier(.3,.2,.4,1) forwards}
  @keyframes note{0%{opacity:0;transform:translate(0,0) scale(.5) rotate(0)}15%{opacity:.95}
    50%{transform:translate(calc(var(--dx) * .5 + 9px),-55px) scale(1) rotate(var(--rot))}
    100%{opacity:0;transform:translate(var(--dx),-120px) scale(1.1) rotate(calc(var(--rot) * -1))}}
  /* ---------- celular ---------- */
  #mnav{display:none}
  body.mobile #nav,body.mobile #count,body.mobile #skip,body.mobile #hitCover{display:none!important}
  body.mobile #mnav{position:fixed;left:0;right:0;bottom:0;height:76px;z-index:90;display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:0 14px env(safe-area-inset-bottom);background:linear-gradient(rgba(245,240,231,0),rgba(245,240,231,.94) 30%);opacity:0;pointer-events:none;transition:opacity .5s ease}
  body.mobile:has(#stage[data-state="pages"]) #mnav{opacity:1;pointer-events:auto}
  #mnav button{width:96px;height:44px;border:0;background:none;padding:0;cursor:pointer;transition:opacity .3s}
  #mnav button img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(60,20,25,.2))}
  #mnav button:disabled{opacity:0;pointer-events:none}
  #mcount{flex:1;text-align:center;font:italic 300 15px 'Fraunces',serif;color:var(--bordo)}
  #mcount b{font-style:normal;font-weight:400}
  /* caderno fechado no celular: o atalho para recrutadores fica na capa, grande e legível */
  body.mobile #hitClosed{left:762px;top:301px;width:465px;height:564px}
  body.mobile #hint{left:994px;top:846px;font-size:28px}
  body.mobile #coverText{left:869px;top:440px;width:250px;height:178px;padding:0 30px;translate:none!important;scale:1!important;isolation:isolate;opacity:0;pointer-events:none;transition:opacity .15s ease}
  body.mobile #coverText::before{content:"";position:absolute;left:50%;top:50%;width:178px;height:250px;margin:-125px 0 0 -89px;rotate:90deg;z-index:-1;
    background:url(assets/renda.webp) center/100% 100% no-repeat;filter:drop-shadow(0 4px 8px rgba(40,10,15,.35))}
  body.mobile #coverText .q{font-size:16px;line-height:1.1}
  body.mobile #coverText .l{font-size:11.5px;margin:3px 0 8px}
  body.mobile #coverText .btns{flex-direction:column;gap:5px;align-items:center}
  body.mobile #coverText button{font-size:8.5px;padding:5px 0;width:100px}
  /* celular: só o botão Resumen, maior (os projetos já aparecem ao abrir o caderno) */
  body.mobile #btnProyectos{display:none}
  body.mobile #coverText #btnResumen{font-size:11px;padding:9px 0;width:132px;letter-spacing:.14em}
  body.mobile [data-state="closed"] #coverText{opacity:1;pointer-events:auto;transition:opacity .6s ease 1s}
  body.mobile #layerCover{display:none}

  .fx .tip{position:absolute;left:0;top:0;transform:translate(-50%,-100%) rotate(-4deg);white-space:nowrap;pointer-events:none;
    font:italic 400 34px/1 'Fraunces',Georgia,serif;color:var(--vinho);text-shadow:0 1px 0 rgba(255,255,255,.8),0 0 10px rgba(255,255,255,.7);
    opacity:0;transition:opacity .25s ease, translate .25s ease;translate:0 8px}
  .fx.side .tip{transform:translate(0,-50%) rotate(-4deg);font-size:17px}
  .fx.below .tip{transform:translate(0,-50%) rotate(-4deg);font-size:40px}
  .fx .tip .arr{position:absolute;left:-96px;top:-72px;width:100px;height:88px;overflow:visible}
  .fx .tip .arr path{fill:none;stroke:var(--vinho);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
  .fx.on .tip{opacity:1;translate:0 0}

  /* ---------- iPod: tela com o player do YouTube ---------- */
  .fx .ytbox{position:absolute;left:0;top:0;width:138px;height:110px;background:#0d0d0f;overflow:hidden;border-radius:2px}
  .fx .ythost{position:absolute;left:0;top:0;width:276px;height:220px;transform:scale(.5);transform-origin:0 0;pointer-events:none}
  .ythost iframe{width:100%;height:100%;border:0;display:block}
  .scr-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    background:linear-gradient(160deg,#d9dee2,#b9c2c8);color:#1d2b33;font-family:'Satoshi',system-ui;transition:opacity .4s ease}
  .scr-idle b{font-size:11px;letter-spacing:.2em}
  .scr-idle span{font:italic 400 22px/1 'Fraunces',Georgia,serif;color:var(--vinho);margin:2px 0}
  .scr-idle i{font-style:normal;font-size:9px;letter-spacing:.1em;opacity:.7}
  .ytlive .scr-idle{opacity:0}
  /* nome da música na etiqueta da mesa */
  .label-song{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 52px;pointer-events:none;color:var(--vinho);z-index:1}
  .label-song small{font:500 12px 'Satoshi',system-ui;letter-spacing:.22em;text-transform:uppercase;opacity:.75}
  .label-song b{font:italic 400 26px/1.1 'Fraunces',Georgia,serif;margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .label-song i{font:400 15px 'Satoshi',system-ui;font-style:normal;margin-top:6px;opacity:.85}
  /* celular: o iPod abre grande */
  #ipodBig{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(30,10,14,0);pointer-events:none;transition:background .4s ease;visibility:hidden}
  #ipodBig.open{background:rgba(30,10,14,.45);pointer-events:auto;visibility:visible}
  #ipodBig.anim{visibility:visible}
  #ipodBig .ib{position:relative;width:min(84vw,330px);aspect-ratio:334/526;transform-origin:50% 50%;will-change:transform}
  #ipodBig .ib img{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;filter:drop-shadow(0 22px 30px rgba(30,8,12,.4))}
  #ipodBig .ib-scr{position:absolute;left:8.4%;top:5.5%;width:82.6%;height:41.8%;background:#0d0d0f;z-index:1;overflow:hidden}
  #ipodBig .ythost{position:absolute;inset:0;pointer-events:none}
  #ipodBig.tapyt .ythost{pointer-events:auto}
  #ipodBig.tapyt .scr-idle{opacity:0;pointer-events:none}
  #ipodBig .scr-idle b{font-size:15px} #ipodBig .scr-idle span{font-size:44px} #ipodBig .scr-idle i{font-size:12px}
  #ipodBig .ib-x{position:absolute;right:-8px;top:-8px;z-index:3;width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.92);
    color:var(--vinho);font:400 17px/26px 'Satoshi',system-ui;text-align:center;padding:0;cursor:pointer;box-shadow:0 2px 8px rgba(30,8,12,.25)}
  #ipodBig .ib-song{position:absolute;left:0;right:0;top:calc(100% + 14px);text-align:center;color:#fff;font:italic 400 17px 'Fraunces',Georgia,serif;text-shadow:0 1px 6px rgba(0,0,0,.5)}
  /* capa virando como folha + dedinho de dica */
  .cvflip #coverText{z-index:43}   /* fica parada na capa; a folha passa por cima dela */
  .cvnojump #coverText{transition:none!important}
  /* sem a legendinha "untitled — ….png" em cima das janelas do Paint */
  .paint-cap{display:none!important}
  /* botão de idioma ES · PT */
  #lang{position:fixed;top:14px;right:18px;z-index:300;display:flex;align-items:center;gap:6px;font:500 11px 'Satoshi',system-ui;letter-spacing:.16em;color:var(--bordo)}
  #lang button{border:0;background:none;padding:4px 2px;cursor:pointer;font:inherit;letter-spacing:inherit;color:inherit;opacity:.5;border-bottom:1px solid transparent}
  #lang button:hover{opacity:.85}
  #lang button.on{opacity:1;border-bottom-color:rgba(92,26,43,.45)}
  #lang i{font-style:normal;opacity:.35}
  body.mobile #lang{top:8px;right:10px}
  /* celular: o texto de "Sobre mí" um pouco mais perto da dobra */
  body.mobile .txt[data-hkey="autora:L"] .blk{translate:-30px 0}
  /* troca capa ↔ páginas sem "ajustada": as páginas aparecem por baixo da folha sem animar */
  .cvnojump #pages,.cvnojump #cover,.cvnojump #layerCover{transition:none!important}
  .cvnojump #bookGrp{transition:opacity .28s ease!important}
  .cvnojump #nav{transition:none!important}
  .cv-finger{position:absolute;left:0;top:0;margin:-7px 0 0 -19px;transform-origin:19px 7px;pointer-events:none;opacity:0;z-index:40;filter:drop-shadow(0 4px 6px rgba(60,10,20,.25))}
  @media (prefers-reduced-motion: reduce){ .fx .steam,.fx .note{animation:none} }

  /* ---------- estados ---------- */
  .grp{position:absolute;inset:0;transition:opacity .7s ease, transform .9s var(--ease)}
  #closedWrap{z-index:9;transform-style:preserve-3d}
  #closedBook{transform:var(--closed-tf);transition:transform 1.1s var(--ease), opacity .5s ease .6s;backface-visibility:hidden}
  #cover{z-index:7}
  #bookGrp{z-index:20}
  #pages{z-index:21}
  [data-state="loading"] .desk, [data-state="loading"] #cover, [data-state="loading"] #closedWrap,
  [data-state="loading"] #bookGrp, [data-state="loading"] #pages{opacity:0}
  /* os fones (por baixo do iPod) também ficam escondidos durante o holis */
  #deskLayer img.added{transition:opacity .8s ease}
  [data-state="loading"] #deskLayer img.added{opacity:0}
  [data-state="messy"] #cover, [data-state="messy"] #bookGrp, [data-state="messy"] #pages, [data-state="messy"] #closedWrap{opacity:0}
  [data-state="closed"] #cover, [data-state="closed"] #bookGrp, [data-state="closed"] #pages{opacity:0}
  #closedWrap{opacity:0}
  [data-state="messy"] .later{opacity:0}
  .later{transition:transform 1.6s var(--ease), opacity .8s ease 1.2s}
  [data-state="closed"] #closedWrap{opacity:1;transition:opacity .9s ease .7s}
  [data-state="cover"] #closedWrap, [data-state="pages"] #closedWrap{opacity:1}
  [data-state="cover"] #closedBook, [data-state="pages"] #closedBook{transform:var(--closed-tf) rotateY(-178deg);opacity:0}
  [data-state="cover"] #bookGrp, [data-state="cover"] #pages{opacity:0;transform:translateX(30px)}
  #cover{transition:opacity .8s ease .25s}
  [data-state="closed"] #cover{transition:opacity .3s ease}
  [data-state="pages"] #cover, [data-state="pages"] #layerCover{transition:opacity .2s ease 0s}   /* a capa (e a etiqueta) somem logo ao passar para as páginas */
  #coverText{opacity:0;transition:opacity .15s ease}
  [data-state="cover"] #coverText{opacity:1;transition:opacity .8s ease .9s}

  /* ---------- cargando ---------- */
  #loader{position:absolute;inset:0;z-index:50;transition:opacity .8s ease}
  #loader.out{opacity:0;pointer-events:none}
  #loader svg{position:absolute;inset:0;width:1440px;height:1024px;overflow:visible}
  #loadPen{position:absolute;left:0;top:0;width:493px;height:493px;will-change:transform}
  #skip{position:absolute;right:48px;bottom:36px;z-index:60;font:italic 300 18px 'Fraunces',serif;color:var(--bordo);background:none;border:0;cursor:pointer;opacity:.7}
  #skip:hover{opacity:1}
  [data-state]:not([data-state="loading"]):not([data-state="messy"]) #skip{display:none}

  /* ---------- cuaderno cerrado ---------- */
  #hint{position:absolute;left:782px;top:975px;transform:translateX(-50%);z-index:30;font:italic 300 22px 'Fraunces',serif;color:var(--bordo);opacity:0;transition:opacity .6s ease;white-space:nowrap;pointer-events:none}
  [data-state="closed"] #hint{opacity:.85;transition-delay:1.6s;animation:breathe 2.6s ease-in-out infinite 2s}
  @keyframes breathe{50%{opacity:.4}}
  #hitClosed{position:absolute;left:512px;top:306px;width:540px;height:655px;z-index:40;cursor:pointer;display:none}
  [data-state="closed"] #hitClosed{display:block}
  #hitCover{position:absolute;left:300px;top:200px;width:960px;height:760px;z-index:40;cursor:pointer;display:none}
  [data-state="cover"] #hitCover{display:block}

  /* etiqueta de la portada: atajo */
  #coverText{position:absolute;left:470px;top:298px;width:228px;height:134px;z-index:45;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--bordo)}
  #coverText .q{font:400 19px/1.1 'Fraunces',serif;letter-spacing:-.01em}
  #coverText .l{font:italic 300 14px 'Fraunces',serif;margin:5px 0 11px;color:var(--rosa)}
  #coverText .btns{display:flex;gap:8px}
  #coverText button{font:500 10px 'Satoshi',sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:8px 12px;border-radius:999px;border:1px solid var(--bordo);background:transparent;color:var(--bordo);cursor:pointer;transition:background .25s,color .25s}
  #coverText button.fill,#coverText button:hover{background:var(--bordo);color:var(--off)}
  #coverText button.fill:hover{background:var(--vinho)}
  [data-state]:not([data-state="cover"]) #coverText{pointer-events:none}

  /* tag "SOBRE MÍ" en la página de estrellas */
  #aboutTag{position:absolute;left:868px;top:520px;z-index:45;transform:rotate(-6deg);cursor:pointer;opacity:0;transition:opacity .8s ease 1.1s, transform .35s ease;filter:drop-shadow(0 6px 10px rgba(60,20,25,.25))}
  [data-state="cover"] #aboutTag{opacity:1}
  [data-state]:not([data-state="cover"]) #aboutTag{pointer-events:none;transition-delay:0s}
  #aboutTag:hover{transform:rotate(-2deg) translateY(-3px)}
  #aboutTag .t{position:relative;display:block;background:var(--off);color:var(--bordo);font:500 15px 'Satoshi',sans-serif;letter-spacing:.28em;padding:16px 26px 16px 46px;clip-path:polygon(22px 0,100% 0,100% 100%,22px 100%,0 50%)}
  #aboutTag .t::before{content:"";position:absolute;left:20px;top:50%;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;background:#c9a77d;box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
  #aboutTag .s{position:absolute;left:-62px;top:24px;width:90px;height:2px;background:var(--vinho);transform:rotate(-24deg);transform-origin:100% 50%;border-radius:2px}

  /* carta resumen */
  #carta{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;background:rgba(40,12,18,.5);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .45s ease;overflow-y:auto;--W:min(520px,84vw)}
  #carta.on{opacity:1;pointer-events:auto}
  /* envelope */

  #carta dl{display:block;margin:26px 0 36px;padding:20px 0 6px;border-top:1px solid rgba(92,26,43,.2);border-bottom:1px solid rgba(92,26,43,.2)}

  #mnav{display:none}

    padding:0 14px calc(env(safe-area-inset-bottom) + 0px);background:linear-gradient(rgba(245,240,231,0),rgba(245,240,231,.94) 30%);opacity:0;pointer-events:none;transition:opacity .5s ease}
